parameters:
  enable_scanline: true      # grid column n is transmit n; sets grid_size_x = n_tx
  grid_type: polar           # steered rays from each transmit origin (sector scan)
  f_number: 0.0
  zlims: [0.005, 0.12]       # along-ray distance from the transmit origin
  grid_size_z: 224
  bandwidth: 2000000.0
display: {dynamic_range: [-50.0, -12.0]}

pipeline:
  operations:
    - {name: select_scanlines}
    - {name: cast, params: {dtype: float32}}
    - {name: band_pass_filter, params: {num_taps: 128, axis: -3}}
    - {name: apply_window}
    - {name: demodulate}
    - name: map_scanlines
      operations:
        - {name: tof_correction}
        - {name: delay_and_sum}
        - {name: reshape_grid}
        - {name: envelope_detect}
    - {name: stack_scanlines}
    - {name: normalize}
    - {name: log_compress}
