[project]
name = "ius-2026-cogus-workshop"
version = "0.1.0"
description = "IEEE IUS 2026 Short Course: AI for Cognitive Ultrasound Imaging"
requires-python = ">=3.11"
dependencies = [
    # `zea[jax]` pulls in jax[cuda12] on Linux and plain jax elsewhere, which is the
    # backend the notebook selects via KERAS_BACKEND. Works on both CPU and GPU.
    "zea[jax]>=0.1.5",
    "tabulate",
    "jupyter",
]

[dependency-groups]
dev = ["ruff", "pre-commit"]

[tool.ruff]
target-version = "py311"
